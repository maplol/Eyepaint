<svg xmlns="http://www.w3.org/2000/svg" width="480" height="960" viewBox="0 0 480 960" fill="none">
  <rect width="480" height="960" fill="#1c2428"/>
  <!-- 8-head standing figure, upright, balanced -->
  <!-- head = 1 unit ≈ 100px from y=40 -->
  <circle cx="240" cy="90" r="42" fill="#e09a6a"/>
  <!-- neck -->
  <rect x="222" y="128" width="36" height="28" rx="8" fill="#d4895a"/>
  <!-- torso (2 heads) -->
  <path d="M170 160 L310 160 L300 360 L180 360 Z" fill="#c9855c"/>
  <!-- waist / pelvis -->
  <path d="M180 360 L300 360 L290 430 L190 430 Z" fill="#b8764f"/>
  <!-- arms hanging natural, nearly vertical -->
  <path d="M170 175 L145 175 L130 390 L155 392 Z" fill="#e09a6a"/>
  <path d="M310 175 L335 175 L350 390 L325 392 Z" fill="#e09a6a"/>
  <!-- legs straight down -->
  <path d="M190 430 L235 430 L228 820 L195 820 Z" fill="#c9855c"/>
  <path d="M245 430 L290 430 L285 820 L252 820 Z" fill="#c9855c"/>
  <!-- feet -->
  <ellipse cx="205" cy="835" rx="28" ry="12" fill="#a86a45"/>
  <ellipse cx="275" cy="835" rx="28" ry="12" fill="#a86a45"/>
  <!-- midline + head marks for learning -->
  <line x1="240" y1="40" x2="240" y2="860" stroke="#ffd9bd" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="160" y1="140" x2="320" y2="140" stroke="#ffd9bd" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="170" y1="360" x2="310" y2="360" stroke="#ffd9bd" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <line x1="190" y1="430" x2="290" y2="430" stroke="#ffd9bd" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="5 4"/>
</svg>
